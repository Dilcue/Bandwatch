name: Release

# Cut a release by pushing an ANNOTATED tag whose message is the changelog
# (written in Markdown), e.g.:
#   git tag -a v0.2.3 -m "## What's new in 0.2.3
#
#   - Fixed the frobnicator"
#   git push origin v0.2.3
# The tag message becomes the top of the release notes; this workflow appends
# the standard install instructions below it, builds the universal (Apple
# Silicon + Intel) .app, zips it, and attaches it to the release for that tag
# (creating the release if it doesn't exist yet). A lightweight tag with no
# message still works — the notes are then just the install instructions.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # needed to create/upload the release

jobs:
  build-and-release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      # Note: the full test suite is run locally before tagging. It is not run
      # here because several tests exercise real microphone capture, which a
      # headless GitHub runner has no audio device for. The release build below
      # still fails the workflow on any compile error.

      - name: Stamp bundle version from the tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          plutil -replace CFBundleShortVersionString -string "$VERSION" Resources/Info.plist
          echo "Bundle version set to $VERSION (so the app version and the zip name match the tag)"

      - name: Build universal package
        run: ./scripts/package-app.sh

      - name: Publish release with binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          ASSET="dist/Bandwatch-${VERSION}-universal.zip"
          test -f "$ASSET" || { echo "expected asset not found: $ASSET"; ls -la dist; exit 1; }

          # Use the annotated tag's message as the changelog atop the notes.
          # actions/checkout can leave the triggering tag as a lightweight ref,
          # so re-fetch the annotated object to read it. If the tag has no
          # message, CHANGELOG is empty and we fall back to just the install
          # instructions.
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}" 2>/dev/null || true
          CHANGELOG="$(git for-each-ref "refs/tags/${GITHUB_REF_NAME}" --format='%(contents)')"
          CHANGELOG_BLOCK=""
          if [ -n "$CHANGELOG" ]; then
            CHANGELOG_BLOCK="${CHANGELOG}

          ---
          "
          fi

          NOTES="$(cat <<EOF
          ${CHANGELOG_BLOCK}Universal build (Apple Silicon + Intel) of Bandwatch. Requires macOS 15 (Sequoia) or newer.

          ## Install
          1. Download \`Bandwatch-${VERSION}-universal.zip\` below, unzip it, and move \`Bandwatch.app\` to \`/Applications\`.
          2. It is ad-hoc signed (not notarized), so on first open macOS blocks it. Either run:
             \`\`\`
             xattr -dr com.apple.quarantine /Applications/Bandwatch.app
             \`\`\`
             or try to open it once, then go to **System Settings → Privacy & Security** and click **Open Anyway**.
          3. Launch it and grant microphone access.

          Prefer no warning at all? Build from source: \`git clone\` this repo and run \`./scripts/run.sh\`.
          See DEPLOY.md for details.
          EOF
          )"

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME exists — uploading asset"
            gh release upload "$GITHUB_REF_NAME" "$ASSET" --clobber
          else
            echo "Creating release $GITHUB_REF_NAME"
            gh release create "$GITHUB_REF_NAME" "$ASSET" \
              --title "Bandwatch ${VERSION}" --notes "$NOTES"
          fi
